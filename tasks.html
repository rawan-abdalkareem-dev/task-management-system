<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المهام - Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- القائمة الجانبية -->
        <div class="sidebar">
            <h2>لوحة التحكم</h2>
            <ul>
                <li><a href="projects.html">المشاريع</a></li>
                <li><a href="tasks.html" class="active">المهام</a></li>
                <li><a href="kanban.html">لوحة كانبان</a></li>
            </ul>
        </div>

        <!-- المحتوى الرئيسي -->
        <div class="main-content">
            <header>
                <h1>إدارة المهام داخل المشروع</h1>
                <button class="btn-primary" onclick="openTaskModal()">+ إضافة مهمة جديدة</button>
            </header>

            <!-- جدول عرض المهام -->
            <section class="table-section">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>عنوان المهمة (title)</th>
                            <th>الوصف (description)</th>
                            <th>الأولوية (priority)</th>
                            <th>الحالة (status)</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>تصميم واجهة المستخدم</td>
                            <td>إنشاء نماذج الإدخال لصفحة المهام</td>
                            <td><span class="badge high">high</span></td>
                            <td><span class="badge new">new</span></td>
                            <td>
                                <button class="btn-action edit" onclick="openTaskModal()">تعديل</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </div>

    <!-- نموذج إضافة مهمة جديدة (SUB-2.2.1) - مطابق لجدول tasks في DB -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeTaskModal()">&times;</span>
            <h2>إضافة مهمة جديدة</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="title">عنوان المهمة (title):</label>
                    <input type="text" id="title" name="title" placeholder="أدخل عنوان المهمة" required>
                </div>
                
                <div class="form-group">
                    <label for="description">وصف المهمة (description):</label>
                    <textarea id="description" name="description" rows="3" placeholder="تفاصيل المهمة..."></textarea>
                </div>

                <div class="form-group">
                    <label for="priority">الأولوية (priority):</label>
                    <select id="priority" name="priority">
                        <option value="high">عالية (high)</option>
                        <option value="medium">متوسطة (medium)</option>
                        <option value="low">منخفضة (low)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="status">الحالة (status):</label>
                    <select id="status" name="status">
                        <option value="new">جديد (new)</option>
                        <option value="in_progress">قيد العمل (in_progress)</option>
                        <option value="completed">مكتمل (completed)</option>
                    </select>
                </div>

                <button type="submit" class="btn">حفظ المهمة</button>
            </form>
        </div>
    </div>

    <script>
        function openTaskModal() {
            document.getElementById('taskModal').style.display = 'flex';
        }
        function closeTaskModal() {
            document.getElementById('taskModal').style.display = 'none';
        }
    </script>
</body>
</html>
