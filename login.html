<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المهام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <h2>تسجيل الدخول</h2>
            <p>أدخل بياناتك للوصول إلى لوحة التحكم</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">البريد الإلكتروني (Email):</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required class="form-control">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور (Password):</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required class="form-control">
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> تذكرني
                </label>
                <a href="#" class="forgot-pass">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block">دخول</button>
        </form>
    </div>

</body>
</html>
